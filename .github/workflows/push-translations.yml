name: Push translations 🗺

on:
  push:
    branches:
      - main
#    paths:
#      - '**.py'
#      - '**.ui'


jobs:
  push:
    name: Push translations
    runs-on: ubuntu-latest
    if: github.repository == 'QuickOSM/QuickOSM'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install Python QGIS-Plugin-CI
      run: pip install "qgis-plugin-ci[pyqt,weblate] @ git+https://github.com/Gustry/qgis-plugin-ci.git@local-ts-files"

    - name: Push to weblate
      run: qgis-plugin-ci -vv push-translation --weblate-token ${{ secrets.WEBLATE_TOKEN }}
