name: Tests 🎳

on:
  push:
    tags:
      - "*"
    branches:
      - main
#    paths:
#      - 'QuickOSM/**'
  pull_request:
    branches:
      - main
#    paths:
#      - 'QuickOSM/**'

jobs:

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test-qgis:
    name: QGIS Desktop ${{ matrix.qgis-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Docker image tags of qgis/qgis
        qgis-version: ['3.44', '4.2']
    env:
      QGIS_VERSION: ${{ matrix.qgis-version }}
    defaults:
      run:
        working-directory: .docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Launching docker compose
        run: ./start.sh
      - name: Running tests
        run: ./exec.sh

  pyqt6-check:
    name: PyQt6
    uses: qgis/qgis-plugin-ci/.github/workflows/pyqt6_test.yml@master
    with:
      plugin_path: QuickOSM

  package-commit:
    needs: [test-qgis, pre-commit]

    name: Package commit
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
        with:
          # To fetch tags
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: "requirements/packaging.txt"

#      - name: Install Qt lrelease for translations
#        run: |
#          sudo apt-get update
#          sudo apt-get install qttools5-dev-tools

      - name: Install Python requirements
        run: pip install -r requirements/packaging.txt

      - name: Set env
        run: |
          TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "VERSION=$(echo ${TAG} | awk -F. -v OFS=. 'NF==1{print ++$NF}; NF>1{if(length($NF+1)>length($NF))$(NF-1)++; $NF=sprintf("%0*d", length($NF), ($NF+1)%(10^length($NF))); print}')-alpha" >> $GITHUB_ENV

      - name: Package
        run: >-
          qgis-plugin-ci
          package ${{ env.VERSION }}

      - name: Unzip
        run: unzip QuickOSM.${{ env.VERSION }}.zip -d tmp

      - uses: actions/upload-artifact@v7
        with:
          name: QuickOSM.${{ env.VERSION }}
          path: tmp

  release:
#    needs: [test-qgis, pre-commit]

    name: Package release
    runs-on: ubuntu-latest
    if: github.repository == 'QuickOSM/QuickOSM' && contains(github.ref, 'refs/tags/')

    steps:
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Qt lrelease
        run: |
          sudo apt-get update
          sudo apt-get install qttools5-dev-tools

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/packaging.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python requirements
        run: pip install -r requirements/packaging.txt

      - name : Fetch current changelog
        run: qgis-plugin-ci changelog ${{ env.RELEASE_VERSION }} >> release.md

      - name: Create release on GitHub
        uses: ncipollo/release-action@v1.21.0
        with:
          bodyFile: release.md
          token: ${{ secrets.QGIS_PLUGIN_TOKEN }}

      - name: Package and deploy the zip
        run: >-
          qgis-plugin-ci
          release ${{ env.RELEASE_VERSION }}
          --github-token ${{ secrets.QGIS_PLUGIN_TOKEN }}
          --transifex-token ${{ secrets.TRANSIFEX_TOKEN }}
          --qgis-token ${{ secrets.QGIS_TOKEN }}
          --create-plugin-repo
