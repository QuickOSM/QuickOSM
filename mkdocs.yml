site_name: QuickOSM
site_author: Etienne
site_description: Download OSM data within QGIS with the Overpass
site_url: https://quickosm.github.io/QuickOSM/
repo_url: https://github.com/QuickOSM/QuickOSM
copyright: '<span class="copyleft">&copy;</span> QuickOSM Project'

docs_dir: docs
site_dir: build

nav:
    - Home: index.md
    - User guide:
        - 'End user': 'user-guide/end-user.md'
        - 'Map preset': 'user-guide/map-preset.md'
        - 'QGIS Model and Python API': 'user-guide/processing.md'
    - Processing: processing/README.md
    - Changelog: changelog.md
    - Contributing: contributing.md
    - Translation: translation-stats.md
    - References: references.md

plugins:
  - search
  - git-revision-date-localized
#  - mkdocstrings:
#      default-handler: python
#      handlers:
#        python:
##          setup_commands:
##            - import sys
##            - sys.path.append('QuickOSM/QuickOSM')
#          selection:
#            filters:
#              - "!^doc_processing.py"
#            docstring_style: restructured-text
#          rendering:
#            show_root_heading: true
#            show_source: false
#            show_signature_annotations: true
#      watch:
#        - QuickOSM

markdown_extensions:
  - admonition:
  - attr_list:
  - meta:
  - pymdownx.details:
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx.inline
  - pymdownx.keys:
  - pymdownx.magiclink:
  - pymdownx.progressbar:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
  - pymdownx.snippets:
  - toc:
      permalink: "#"

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/highlight.min.js
  - https://unpkg.com/mermaid@8.6.4/dist/mermaid.min.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/styles/default.min.css
  - media/code.css
  - media/progress_bar.css

theme:
  name: material
  font: false
  icon:
    repo: fontawesome/brands/github-alt
  language: 'en'
  logo: media/icon.png
  favicon: media/icon.png
  palette:
    accent: deep-orange
    primary: green
    scheme: preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
