services:
  qgis:
    image: qgis/qgis:${QGIS_VERSION:-3.44}
    container_name: qgis
    # The default command is bash, it exits without a TTY
    tty: true
    volumes:
      # - /tmp/.X11-unix:/tmp/.X11-unix
      - ../${PLUGIN_NAME}:/tests_directory/${PLUGIN_NAME}
      - ../debug-docker:/tmp
    environment:
      # - DISPLAY=unix$DISPLAY
      - DISPLAY=:99
      - CI=true
