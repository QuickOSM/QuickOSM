[tool.qgis-plugin-ci]
plugin_path = "QuickOSM"
github_organization_slug = "QuickOSM"
project_slug = "QuickOSM"
transifex_organization = "quickosm"
transifex_project = "gui"
i18n_resource_name = "quickosm"
transifex_coordinator = "etrimaille"
lrelease_path= "/usr/lib/qt6/bin/lrelease"
translation_languages = [
    "cs",
    "da",
    "de",
    "el",
    "es",
    "fi",
    "fr",
    "he",
    "hu",
    "id",
    "is",
    "it",
    "ja",
    "ja_JP",
    "ko",
    "my_MM",
    "nl",
    "pl",
    "pt",
    "pt_BR",
    "ro",
    "ru",
    "sv",
    "tr_TR",
    "uk",
    "vi",
    "zh",
    "zh_TW",
]

[tool.ruff]
line-length = 115
target-version = "py310"
extend-exclude = [
    "QuickOSM/test/mocked_web_server.py",
    "x_test*.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "I",    # isort
    "TID",  # flake8-tidy-imports, for absolute imports
    "UP031",  # no printf-style formatting, like flake8-pep3101
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["QuickOSM"]
lines-between-types = 1
